<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      <div class="np-title">
        <ion-icon name="notifications-outline"></ion-icon>
        <span>Notificaciones</span>
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()" fill="clear" color="light">
        <ion-icon name="close-circle-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="np-content">
  <div class="np-lista" *ngIf="alertas.length > 0">
    <button type="button" class="np-item" *ngFor="let a of alertas" (click)="irA(a)">
      <div class="np-item__icono"><ion-icon [name]="a.icono"></ion-icon></div>
      <div class="np-item__texto">
        <strong>{{ a.titulo }}</strong>
        <span>{{ a.detalle }}</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="np-item__flecha"></ion-icon>
    </button>
  </div>

  <div class="np-vacio" *ngIf="alertas.length === 0">
    <ion-icon name="checkmark-done-circle-outline"></ion-icon>
    <h3>Sin alertas</h3>
    <p>No hay novedades pendientes por ahora.</p>
  </div>
</ion-content>
